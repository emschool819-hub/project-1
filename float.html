<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" type="text/css">
</head>
<body>
    <div class="container mt-5">
        <div class="form-group col mb-4">
            <label 
            class="col-lg-2 col-form label"
            for="valid-input">Email</label>
            <div class="col-lg-10">
                <input type="email"
                class="form-control is-valid"
                id="valid-input"
                placeholder="Email"
                required>
            </div>
            <div class="valid-feedback">nice!</div>
        </div>
         <div class="form-group col mb-4">
            <label 
            class="col-lg-2 col-form label"
            for="valid-input">Password</label>
            <div class="col-lg-10">
                <input type="password"
                class="form-control is-invalid"
                id="invalid-input"
                placeholder="Password"
                required>
            </div>
            <div class="invalid-feedback">You Must Enter Your Password.</div>
        </div>
        <div class="form-floating">
            <select class="form-select" id="floatingSelect"
            aria-label="floating label select">
            <option value="" selected>choose a module </option>
               <option value="1">Web Development</option>
                  <option value="2">Networking</option>
                     <option value="3">Construction Working</option>
        </select>
        <label for="floatingSelect">Select Module</label>
        </div>
    </div>

      <script src="js/bootstrap.bundle.min.js" type="text/js">

      </script>
</body>
</html>
