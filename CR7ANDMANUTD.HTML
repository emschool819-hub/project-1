<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="css/bootstrap.min.css" type="text/css">

</head>
<body>
    
<div class="container mt-5 me-5">
    <div class="form-check">
        <input class="form-check-input" type="checkbox" role="switch " id="switchdefaultcheck">
        <label class="form-check-label" for="switchdefaultcheck">web development</label>
    </div>
    
       <div class="form-check ">
        <input class="form-check-input" type="checkbox" role="switch " id="switchcheckchecked" checked>
        <label class="form-check-label" for="switchcheckchecked" >PC maintainance</label>
    </div>
     <br>
    <hr>
   <div class="form-check">
  <input class="form-check-input" 
         type="radio" 
         name="grade" 
         id="grade11" 
         value="11">
  <label class="form-check-label" for="grade11">
    Grade 11
  </label>
</div>

<div class="form-check">
  <input class="form-check-input" 
         type="radio" 
         name="grade" 
         id="grade12" 
         value="12" 
         checked>
  <label class="form-check-label" for="grade12">
    Grade 12
  </label>
</div>

     <br>
    <hr>
       <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch " id="switchdefaultcheck" >
        <label class="form-check-label" for="switchdefaultcheck">Enable Notifications</label>
    </div>
       <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch " id="switchdefaultcheck" checked>
        <label class="form-check-label" for="switchdefaultcheck" >Dark mode</label>
    </div>
</div>



    <script src="js/bootstrap.bundle.min.js" type="text/js"></script>

</body>
</html>
