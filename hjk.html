<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-5">
    <h2 class="text-success">Ministry Of Education</h2>
    <h3>CTE: Grade 12 Module Preparation Program</h3>
    </div>

<div class="container mt-5">
<form class="row gy-2 gx-3 align-items-center" action="messi.html">
  <div class="col-auto">
    <label class="visually-hidden" for="autoSizingInput">display Name</label>
    <input type="text" class="form-control" id="autoSizingInput" placeholder="display name" required-->
  </div>
   <div class="col-auto">
    <label class="visually-hidden" for="autoSizingInput">Mobile number</label>
    <input type="tel" class="form-control" id="autoSizingInput" placeholder="Mobile number" required>
  </div>
  <div class="col-auto">
    <label class="visually-hidden" for="autoSizingInput">Password</label>
    <input type="password" class="form-control" id="autoSizingInput" placeholder="Password" required>
  </div>
   <div class="col-auto">
    <label class="visually-hidden" for="autoSizingInput">Security pin</label>
    <input type="password" class="form-control" id="autoSizingInput" pattern="[0-9]{4}"
        maxlength="4" placeholder="Security pin" required>
  </div>
  
  
  <div class="col-auto">
    <button type="submit" class="btn btn-success">Sign in</button>
  </div>
</form>
</div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
