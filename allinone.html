<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Practice</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <div class="accordion" id="uy">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseOne">
                    Section 1
                </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse show"
                 data-bs-parent="#uy">
                <div class="accordion-body">
                    Content For Section 1
                </div>
            </div>
        </div>
    </div>

    <br>

    <button type="button" class="btn btn-primary">
        Messages <span class="badge bg-danger">4</span>
    </button>
    <button class="btn btn-success">Success Btn</button>
    <button class="btn btn-warning btn-lg">Warning btn lg</button>
    <button class="btn btn-danger btn-sm">Danger btn sm</button>

    <br><br>

    <div class="card" style="width: 18rem;">
        <img src="cyber.png" class="card-img-top" alt="">
        <div class="card-body">
            <h5 class="card-title">Card title</h5>
            <p class="card-text">Card text</p>
            <a href="#" class="btn btn-primary">Go</a>
        </div>
    </div>

    <br>

    <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="network.jpg" class="d-block w-100" alt="">
            </div>
            <div class="carousel-item">
                <img src="cyber.png" class="d-block w-100" alt="">
            </div>
            <div class="carousel-item">
                <img src="web-design-technology-browsing-programming-concept_53876-163260.avif"
                     class="d-block w-100" alt="">
            </div>
        </div>
        <button class="carousel-control-prev" type="button"
                data-bs-target="#carouselExample"
                data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button"
                data-bs-target="#carouselExample"
                data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <br>

    <button class="btn btn-primary" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#a">
        Toggle Content
    </button>

    <div class="collapse" id="a">
        <div class="card card-body">
            This is for you
        </div>
    </div>

    <br>

    <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown">
            Dropdown Menu
        </button>
        <ul class="dropdown-menu">
            <li><a href="#" class="dropdown-item">Option 1</a></li>
            <li><a href="#" class="dropdown-item">Option 2</a></li>
            <li><a href="#" class="dropdown-item">Option 3</a></li>
        </ul>
    </div>

    <br>

    <button class="btn btn-info"
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop">
        Open Modal
    </button>

    <div class="modal fade" id="staticBackdrop"
         data-bs-backdrop="static"
         data-bs-keyboard="false"
         tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modal title</h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    This is Bootstrap Modal
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Close
                    </button>
                    <button type="button"
                            class="btn btn-primary">
                        Understood
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<br>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a href="#" class="navbar-brand">My Website</a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#b">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="b">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Contact</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
