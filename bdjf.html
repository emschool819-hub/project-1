<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-5">
    <h2 class="">inline form -help text exercise</h2>
    
    </div>

<div class="container mt-5">
<form class="row gy-2 gx-3 align-items-center" action="messi.html">
  <div class="col-auto">
    <label class="visually-hidden" for="autoSizingInput">Username </label>
    <input type="text" class="form-control" id="autoSizingInput" placeholder="Username " minlength="6" maxlength="12" required>
    <small class="form-text text-muted">use 6-12 characters. no spaces allowed.</small>
  </div>
   <div class="col-auto">
    <label class="visually-hidden" for="autoSizingInput">Email </label>
    <input type="email" class="form-control" id="autoSizingInput" placeholder="Email"  required>
        <small class="form-text text-muted">Enter a valid email address.</small>
  </div>
  
  
  
  <div class="col-auto">
    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>
</div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
